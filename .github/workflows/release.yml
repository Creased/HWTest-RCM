name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# TODO(2026-06-02): remove this env block. Node.js 24 becomes the runner
# default on that date, making this opt-in a no-op. Node 20 is fully removed
# on 2026-09-16, so the latest safe deletion date is mid-September 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-bins:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    permissions:
      contents: write
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The devkitarm image carries only devkitARM, and the Wi-Fi probe's PCIe
      # half runs on CPU0 from an AArch64 stub - without a second toolchain the
      # build silently drops it and the release ships with that half disabled.
      #
      # devkitA64 is NOT installable here: pkg.devkitpro.org answers 403 to
      # cloud CI runners, so `dkp-pacman -Sy devkitA64` fails on the database
      # sync. It is not needed either - the stub is freestanding (no libc, no
      # syscalls), so Debian's bare-metal-capable aarch64 gcc builds it, and
      # this image is Debian-based.
      - name: Install an aarch64 compiler for the CPU0 stub
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1

      # REQUIRE_A64=1 makes a missing aarch64 compiler fail the build instead
      # of quietly producing a payload without the stub.
      - name: Build both variants
        run: |
          make all REQUIRE_A64=1 A64_CC=aarch64-linux-gnu-gcc A64_OC=aarch64-linux-gnu-objcopy

      - name: Verify the CPU0 stub was actually built in
        run: |
          test -s build/cpu_stub.bin || { echo "build/cpu_stub.bin missing"; exit 1; }
          for f in build/hwtest.bin build-jc/hwtest_jc.bin; do
            if grep -qa 'devkitA64 absent at build time' "$f"; then
              echo "FAIL: $f was built without the CPU0 stub"; exit 1
            fi
            grep -qa 'CPU0 handoff (PCIe needs' "$f" || {
              echo "FAIL: $f is missing the CPU0 handoff path"; exit 1; }
          done
          echo "CPU0 stub present in both variants ($(stat -c%s build/cpu_stub.bin) bytes)"

      - name: Show artifact sizes
        run: ls -l build/hwtest.bin build-jc/hwtest_jc.bin

      - name: Upload workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: hwtest-bins
          path: |
            build/hwtest.bin
            build-jc/hwtest_jc.bin
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/hwtest.bin
            build-jc/hwtest_jc.bin
          fail_on_unmatched_files: true
          generate_release_notes: true

  build-exe:
    # Windows .exe build for host_tools/hwtest_viewer.py. Runs in parallel
    # with build-bins; both publish to the same GitHub Release on tag pushes.
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No submodules needed -- host_tools is pure Python with no native deps
        # beyond what pip pulls in.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: host_tools/requirements.txt

      - name: Install dependencies
        working-directory: host_tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build hwtest_viewer.exe
        working-directory: host_tools
        # --onefile  : single self-contained .exe; bundles the Python
        #   interpreter so end users don't need Python installed.
        # --windowed : no console window pops up when launched from Explorer.
        #   The script's CLI args (--port, --baud, --replay) are all optional
        #   and still work when invoked from cmd/PowerShell, but the default
        #   double-click flow goes straight into the imgui GUI.
        # --collect-all imgui_bundle : imgui-bundle ships native DLLs and font
        #   assets that PyInstaller's static scan misses; without this the
        #   built exe crashes on import. Mandatory.
        run: >
          pyinstaller
          --onefile
          --windowed
          --name hwtest_viewer
          --collect-all imgui_bundle
          hwtest_viewer.py

      - name: Show artifact size
        working-directory: host_tools
        run: dir dist\hwtest_viewer.exe

      - name: Upload workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: hwtest-viewer-exe
          path: host_tools/dist/hwtest_viewer.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: host_tools/dist/hwtest_viewer.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
